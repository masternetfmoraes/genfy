<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GENFY</title>
  <link rel="stylesheet" href="../styles/output.css" />
  <style>
    body { width: 260px; }
  </style>
</head>
<body class="bg-gray-50 dark:bg-gray-900 text-gray-800 dark:text-gray-100 p-5 font-sans">
  <div class="flex flex-col gap-4">
    <div class="flex items-center justify-between">
      <h1 class="text-xl font-bold text-indigo-600 dark:text-indigo-400">GENFY</h1>
      <span id="genfy-version" class="text-[11px] bg-gray-200 dark:bg-gray-700 text-gray-500 dark:text-gray-300 px-2 py-0.5 rounded">v—</span>
    </div>

    <p class="text-sm text-gray-600 dark:text-gray-300 leading-relaxed">
      Dashboard de inteligência para o seu canal do YouTube.
    </p>

    <p id="genfy-status" class="text-xs text-gray-500 dark:text-gray-400">Verificando sessão...</p>

    <button id="open-dashboard" type="button"
      class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2 px-4 rounded-lg transition">
      Abrir Dashboard
    </button>
  </div>
  <script type="module" src="../scripts/popup.js"></script>
</body>
</html>
