<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GENFY – YouTube Dashboard</title>
  <link rel="stylesheet" href="../styles/output.css" />
</head>
<body>
  <div id="app" class="flex h-screen bg-gray-50 dark:bg-gray-900 text-gray-800 dark:text-gray-100">
    <!-- Overlay mobile -->
    <div id="sidebar-overlay" class="fixed inset-0 z-30 bg-black/40 hidden md:hidden"></div>

    <!-- Sidebar (renderizada via JS) -->
    <aside id="sidebar"
           class="fixed inset-y-0 left-0 z-40 w-64 -translate-x-full transition-transform duration-200 bg-white dark:bg-gray-800 border-r border-gray-200 dark:border-gray-700 md:static md:translate-x-0 md:flex-shrink-0"></aside>

    <!-- Área principal -->
    <main class="flex-1 flex flex-col overflow-hidden min-w-0">
      <!-- Header (renderizado via JS) -->
      <header id="header"
              class="bg-white dark:bg-gray-800 border-b border-gray-200 dark:border-gray-700 px-4 py-3 md:px-6 md:py-4"></header>

      <!-- Área rolável com o ponto único de montagem do dashboard -->
      <div class="flex-1 overflow-y-auto p-4 md:p-6">
        <div id="dashboard-root" class="max-w-[1400px] mx-auto w-full pb-16"></div>
      </div>
    </main>
  </div>

  <script type="module" src="../scripts/pages/dashboard.js"></script>
</body>
</html>
